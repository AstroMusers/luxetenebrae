[build-system]
requires = ["hatchling>=1.20.0", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "luxetenebrae"
dynamic = ["version"]
description = "Lux et Tenebrae: astrophysical population synthesis utilities and pipelines"
authors = [
  { name = "Aysu Ece Saricaoglu, AstroMusers" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["astrophysics", "population-synthesis", "COMPAS"]

# Core runtime dependencies (from requirements.txt, excluding pytest)
dependencies = [
  "numpy",
  "matplotlib",
  "astropy",
  "pandas",
  # Use the released package when publishing luxetenebrae independently.
  # Developers may instead use the optional 'compas' extra for VCS install.
  "compas_python_utils"
]

# If you need to depend on COMPAS from GitHub, prefer documenting installation steps
# or using optional-dependencies with an extra that users can opt into.
# Hatchling does not resolve VCS URLs in dependencies for PyPI publishing best practices.
# You can still `pip install git+https://github.com/TeamCOMPAS/COMPAS.git` separately.

[project.optional-dependencies]
workflow = [
  "tdpy @ git+https://github.com/tansudaylan/tdpy.git@35df1703c6b63d6a62f7d44b12cf5928b5d355ed"
]
dev = [
  "pytest"
]

# Developer convenience: install compas_python_utils directly from TeamCOMPAS repo
# (uses subdirectory install). This should not be used for PyPI releases.
compas = [
  "compas_python_utils @ git+https://github.com/TeamCOMPAS/COMPAS.git#subdirectory=compas_python_utils"
]

[tool.hatch.build]
# Include the Python package directory
include = [
  "src/**"
]

[tool.hatch.build.targets.wheel]
# Pure-Python wheel
pure_python = true

[tool.hatch.build.targets.sdist]
# Default sdist behavior

[tool.hatch.metadata]
# Enable automatic package discovery within the top-level package directory
allow-direct-references = true

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
# Use a regex with a named 'version' group for tags like 'v0.1.0'
tag-pattern = "^v(?P<version>.*)$"

[tool.hatch.build.hooks.vcs]
version-file = "src/_version.py"
local_scheme = "node-and-date"